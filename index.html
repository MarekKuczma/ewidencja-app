<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ewidencja Floty Rinkon</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./ikona-192.png">
<link rel="apple-touch-icon" href="./ikona-192.png">
<meta name="theme-color" content="#27272a">
<style>
  /* ===== PALETA „grafit" — domyślna (D49). Kolory typów sprzętu
     (pomarańcz, zieleń, niebieski, fiolet) są zarezerwowane dla akcentów
     jednostek, dlatego chrom aplikacji jest celowo neutralny. ===== */
  :root{
    --akcent:#3f3f46; --akcent-c:#27272a;
    --gradient:linear-gradient(135deg, #27272a 0%, #52525b 70%, #a1a1aa 100%);
    --ikona-grad:linear-gradient(135deg, #27272a, #71717a);
    --przycisk-cien:rgba(39,39,42,.35);
    --tlo:#f4f6f8; --karta:#ffffff; --input-tlo:#ffffff; --input-brzeg:#d1d5db;
    --tekst:#1f2937; --szary:#6b7280; --blad:#d93025; --ok:#188038;
    --linia:#e5e7eb;
    --bg-uwaga:#fef3c7; --brzeg-uwaga:#f59e0b; --tekst-uwaga:#92400e;
    --bg-ok:#e6f4ea; --tekst-ok:#135c26;
    --bg-blad:#fce8e6; --tekst-blad:#a50e0e;
    --bg-akcentjasny:#f4f4f5; --tekst-akcentjasny:#3f3f46;
    --metryka-grad:linear-gradient(135deg, #fafafa 0%, #f4f4f5 100%);
    --paleta-ikona:#d4d4d8;
  }
  /* ===== PALETA „burgund" — druga, przełączalna (D49) ===== */
  [data-paleta="burgund"]{
    --akcent:#9f1239; --akcent-c:#4c0519;
    --gradient:linear-gradient(135deg, #4c0519 0%, #9f1239 55%, #e11d48 100%);
    --ikona-grad:linear-gradient(135deg, #4c0519, #be123c);
    --przycisk-cien:rgba(159,18,57,.35);
    --bg-akcentjasny:#fff1f2; --tekst-akcentjasny:#9f1239;
    --metryka-grad:linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
    --paleta-ikona:#fda4af;
  }
  /* W ciemnym motywie akcent MUSI się rozjaśnić. Paleta grafitowa ma
     --akcent:#3f3f46, czyli prawie czerń — na ciemnym tle znikały przez to
     obramowania pól, przycisk „Popraw" i aktywna zakładka w dolnym menu
     (zgłoszenie Marka 27.07.2026). Paleta burgundowa miała swój blok dla
     ciemnego motywu od początku, grafitowa nie. */
  [data-motyw="ciemny"]{
    --akcent:#c7c7cf; --akcent-c:#e4e4e7;
    --tlo:#0f1115; --karta:#1c1f26; --input-tlo:#262b34; --input-brzeg:#4b5262;
    --tekst:#f0f1f3; --szary:#9aa1ad; --linia:#333844;
    --bg-uwaga:#453615; --brzeg-uwaga:#8a5a12; --tekst-uwaga:#fcd34d;
    --bg-ok:#123522; --tekst-ok:#86efac;
    --bg-blad:#451a17; --tekst-blad:#fca5a5;
    --bg-akcentjasny:#26262a; --tekst-akcentjasny:#d4d4d8;
    --metryka-grad:linear-gradient(135deg, #1f2127 0%, #24262c 100%);
  }
  [data-motyw="ciemny"][data-paleta="burgund"]{
    --akcent:#fb7185; --akcent-c:#fda4af;
    --bg-akcentjasny:#3f1220; --tekst-akcentjasny:#fda4af;
    --metryka-grad:linear-gradient(135deg, #2a1218 0%, #33161d 100%);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--tlo); color:var(--tekst);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:17px;}
  header{background:var(--gradient); color:#fff; padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top)); position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:12px;}
  header img{width:40px; height:40px; border-radius:10px; flex:none;}
  header h1{margin:0; font-size:19px; font-weight:600;}
  header .kto{font-size:14px; opacity:.9; margin-top:2px;}
  header .naglowek-tekst{flex:1; min-width:0;}
  #motywBtn,#paletaBtn{background:rgba(255,255,255,.2); border:none; border-radius:10px;
    width:40px; height:40px; font-size:18px; color:#fff; flex:none; min-height:auto;
    display:inline-flex; align-items:center; justify-content:center; padding:0;}
  .ikona-paletki{fill:var(--paleta-ikona);}
  main{max-width:560px; margin:0 auto; padding:14px 14px 90px;}
  .karta{background:var(--karta); border-radius:14px; padding:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:14px;}
  .powitanie{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .avatar-krag{width:42px; height:42px; border-radius:50%; background:var(--ikona-grad);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:15px; flex:none;}
  .powitanie .p1{font-size:18px; font-weight:600;}
  .powitanie .p2{font-size:14px; color:var(--szary);}
  label{display:block; font-size:14px; font-weight:600; color:var(--szary); margin:0 0 6px;}
  label .wym{color:var(--blad);}
  label .opcjonalne{font-weight:400; color:var(--szary); opacity:.8;}
  .pole + .pole{margin-top:22px;}
  input,select,textarea{width:100%; max-width:100%; min-width:0; font-size:18px; padding:12px;
    border:1.5px solid var(--input-brzeg); border-radius:10px; background:var(--input-tlo);
    color:var(--tekst); min-height:48px;}
  input[type="date"]{-webkit-min-logical-width:0; -webkit-appearance:none; appearance:none;}
  /* iOS potrafi wyrównać wartość do środka i uciąć ją w wąskim polu — flota
     natrafiła na to w becie (FEEDBACK pkt 7). */
  input[type="date"]::-webkit-date-and-time-value{text-align:left;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--akcent);}
  textarea{min-height:130px; resize:vertical; line-height:1.45; font-size:16px;}
  /* Błędy pól — wzorzec z aplikacji floty: komunikat pod polem + czerwona ramka */
  /* D98 — ostrzeżenie przy polu: coś wygląda podejrzanie, ale zapisać można.
     Celowo inny kolor niż `.blad-pola`, żeby nie mylić z blokadą zapisu. */
  .ostrzezenie-pola{font-size:13px; color:#b06000; margin-top:6px; line-height:1.35;}
  .ostrzezenie-pola:empty{display:none;}
  .blad-pola{color:var(--blad); font-size:14px; margin-top:4px; display:none;}
  .pole-blad input,.pole-blad select,.pole-blad textarea{border-color:var(--blad);}
  .pole-blad .blad-pola{display:block;}
  button{font-family:inherit; cursor:pointer;}
  .przycisk{display:block; width:100%; background:var(--gradient); color:#fff;
    font-size:19px; font-weight:600; border:none; border-radius:12px;
    padding:15px; min-height:54px; margin-top:18px;
    box-shadow:0 4px 12px var(--przycisk-cien);}
  .przycisk:active{opacity:.85; box-shadow:0 2px 6px var(--przycisk-cien);}
  .przycisk[disabled]{opacity:.6;}
  .przycisk-drugi{display:block; width:100%; background:var(--karta); color:var(--akcent);
    border:1.5px solid var(--akcent); font-size:16px; font-weight:600;
    border-radius:12px; padding:12px; min-height:48px; margin-top:10px;}
  .przycisk-maly{background:var(--karta); color:var(--akcent); border:1.5px solid var(--akcent);
    border-radius:10px; font-size:15px; font-weight:600; padding:8px 14px; min-height:40px;}
  .przycisk-czerwony{background:var(--karta); color:var(--blad); border:1.5px solid var(--blad);
    border-radius:10px; font-size:15px; font-weight:600; padding:8px 14px; min-height:40px;}
  .komunikat{border-radius:12px; padding:14px; margin:12px 0; font-size:16px; display:none;}
  .komunikat.ok{display:block; background:var(--bg-ok); border:1px solid var(--ok); color:var(--tekst-ok);}
  .komunikat.blad{display:block; background:var(--bg-blad); border:1px solid var(--blad); color:var(--tekst-blad);}
  .komunikat.uwaga{display:block; background:var(--bg-uwaga); border:1px solid var(--brzeg-uwaga); color:var(--tekst-uwaga);}
  .komunikat ul{margin:6px 0 0; padding-left:20px;}
  /* Metryki dashboardu pojazdu */
  .metryki{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .metryka{background:var(--metryka-grad); border-radius:10px; padding:12px;}
  .metryka .m-et{font-size:13px; color:var(--szary);}
  .metryka .m-w{font-size:clamp(17px, 6vw, 23px); font-weight:600; margin-top:2px;}
  .metryka .m-sub{font-size:12px; color:var(--szary); margin-top:2px;}
  /* Karta jednostki / wpisu — akcent po lewej w kolorze typu sprzętu (D29) */
  .jedn{display:flex; gap:12px; background:var(--karta); border-radius:12px;
    border-left:3px solid var(--szary); box-shadow:0 1px 2px rgba(0,0,0,.06);
    padding:12px 12px 12px 14px; margin-bottom:10px; align-items:center;}
  .ikona-krag{width:38px; height:38px; border-radius:50%; background:var(--karta);
    border:2px solid var(--szary); box-sizing:border-box; flex:none;
    display:flex; align-items:center; justify-content:center;}
  .ikona-krag svg{width:21px; height:21px; display:block;}
  .jedn .tresc{flex:1; min-width:0;}
  .jedn .linia1{font-weight:600; font-size:15px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .jedn .linia2{color:var(--szary); font-size:13px; margin-top:2px;}
  .jedn.uwaga{background:var(--bg-blad);}
  .jedn.uwaga .linia2{color:var(--tekst-blad);}
  .plakietka{display:inline-block; background:var(--bg-akcentjasny); color:var(--tekst-akcentjasny);
    font-size:13px; font-weight:600; border-radius:8px; padding:3px 10px; margin-top:6px;}
  /* Brakowało — plakietka „Anulowany" była szara jak zwykła (wzorzec z floty). */
  .plakietka.plakietka-blad{background:var(--bg-blad); color:var(--tekst-blad);}
  /* Terminy i serwis na pulpicie pojazdu (D56) */
  .terminy{border-top:1px solid var(--linia); margin-top:4px; padding-top:10px; margin-bottom:12px;}
  .terminy .t-naglowek{font-size:13px; font-weight:700; color:var(--szary);
    text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
  .termin{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-size:14px; padding:5px 0;}
  .termin .t-nazwa{color:var(--szary);}
  .termin .t-wartosc{font-weight:600; text-align:right;}
  .termin.pilny .t-wartosc{color:var(--tekst-uwaga);}
  .termin.pilny .t-nazwa::before{content:"⚠ "; color:var(--brzeg-uwaga);}
  .termin.pominiety .t-wartosc{color:var(--tekst-blad);}
  .wpis{display:flex; gap:12px; background:var(--karta); border-radius:12px;
    border-left:3px solid var(--szary); box-shadow:0 1px 2px rgba(0,0,0,.06);
    padding:12px 12px 12px 14px; margin-bottom:10px;}
  .wpis .wpis-tresc{flex:1; min-width:0; cursor:pointer;}
  .wpis .linia1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-weight:600; font-size:15px;}
  .wpis .linia1 span:last-child{flex:none;}
  .wpis .linia2{color:var(--szary); font-size:13px; margin-top:2px;}
  /* Licznik w prawym rogu pierwszej linii kafelka — to po niego kierowca
     najczęściej tu zagląda, więc ma być widoczny bez czytania reszty. */
  .wpis .licznik-rog{font-size:13px; font-weight:400; color:var(--szary);
    white-space:nowrap;}
  .wpis .licznik-rog b{color:var(--tekst); font-weight:600;}
  .wpis.anulowany{border-left-color:var(--linia); background:var(--tlo);}
  .wpis.anulowany .linia1,.wpis.anulowany .linia2,.wpis.anulowany .licznik-rog{
    text-decoration:line-through; color:#9ca3af;}
  .wpis.anulowany .ikona-krag{border-color:var(--linia); opacity:.5;}
  .wpis .akcja{display:flex; gap:8px; margin-top:10px;}
  .wpis-strzalka{width:24px; height:24px; border-radius:50%; background:var(--bg-akcentjasny);
    color:var(--tekst-akcentjasny); font-size:13px; font-weight:700; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    margin-left:4px; transition:transform .15s;}
  .wpis.rozwiniety .wpis-strzalka{transform:rotate(180deg);}
  .wpis-szczegoly{display:grid; grid-template-rows:0fr; opacity:0;
    margin-top:0; padding-top:0; border-top:1px dashed transparent;
    transition:grid-template-rows .25s ease, opacity .25s ease,
      margin-top .25s ease, padding-top .25s ease;}
  .wpis.rozwiniety .wpis-szczegoly{grid-template-rows:1fr; opacity:1;
    margin-top:8px; padding-top:8px; border-top-color:var(--linia);}
  .wpis-szczegoly .wsz-zawartosc{min-height:0; overflow:hidden;}
  .wsz-wiersz{display:flex; justify-content:space-between; gap:10px; font-size:13px;
    color:var(--szary); margin-bottom:4px;}
  .wsz-wiersz b{color:var(--tekst); font-weight:600; text-align:right;}
  /* Dłuższa treść (tankowanie, serwis, uwagi) w DWÓCH liniach: etykieta na
     szaro nad wartością. W jednej linii zawijało się nieczytelnie — przy
     „55L / 55236km + 45L / 56236km" etykieta i wartość walczyły o miejsce. */
  .wsz-wiersz.dwie{display:block;}
  .wsz-wiersz.dwie b{display:block; text-align:left; margin-top:2px;
    word-break:break-word; white-space:normal;}
  .wpisy-naglowek-miesiac{font-size:13px; font-weight:700; color:var(--szary);
    text-transform:uppercase; letter-spacing:.03em; margin:16px 2px 8px;}
  .wpisy-naglowek-miesiac:first-child{margin-top:0;}
  /* E-12 (01.08.2026): nagłówek zamkniętego miesiąca — klikalny, rozwija/
     zwija podgląd wpisów bez możliwości edycji (wzorzec z floty, F-49). */
  .wpisy-naglowek-miesiac.zwijalny{cursor:pointer; display:flex; align-items:center;
    justify-content:space-between; user-select:none;}
  .naglowek-strzalka{transition:transform .15s ease; margin-left:auto;}
  .wpisy-naglowek-miesiac.rozwiniety .naglowek-strzalka{transform:rotate(90deg);}
  /* Tankowanie — powtarzalne pary litry + licznik (D51) */
  .tank-item{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .tank-item input{min-height:44px; font-size:16px; padding:10px;}
  .tank-item.tank-blad input{border-color:var(--blad);}
  .tank-usun{background:none; border:none; color:var(--blad); font-size:22px;
    line-height:1; padding:4px 8px; flex:none; min-height:auto;}
  .tank-podglad{font-size:14px; color:var(--szary); margin-top:6px;}
  details.dodatki{border:1.5px solid var(--linia); border-radius:10px; padding:10px 12px;
    margin-top:20px;}
  details.dodatki summary{font-size:14px; font-weight:600; color:var(--szary); cursor:pointer;}
  .kolejka-info{background:var(--bg-uwaga); color:var(--tekst-uwaga); border-radius:12px;
    padding:10px 14px; margin-bottom:12px; font-size:15px; display:none;}
  /* Odrzucony wpis z kolejki — wzorzec z aplikacji floty (.odrzucony) */
  .odrzucony{background:var(--bg-blad); color:var(--tekst-blad); border-radius:10px;
    padding:10px; margin-top:8px; font-size:14px;}
  .odrzucony .p{display:flex; gap:8px; margin-top:8px;}
  nav{position:fixed; bottom:0; left:0; right:0; background:var(--karta);
    border-top:1px solid var(--linia); display:flex; z-index:5;
    padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1; background:none; border:none; padding:12px 0 10px;
    font-size:13px; font-weight:600; color:var(--szary); min-height:56px;}
  nav button.aktywna{color:var(--akcent);}
  nav button .i{display:block; font-size:22px; line-height:1.1;}
  /* Numer wpisu w „kapsułce" — wzorzec z aplikacji floty (.plakietka-id) */
  .plakietka-id{background:var(--bg-akcentjasny); color:var(--tekst-akcentjasny); font-weight:700;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    padding:2px 7px; border-radius:6px; flex:none;}
  .wpis .linia-data{display:flex; justify-content:space-between; align-items:center;
    gap:8px; color:var(--szary); font-size:12px; margin-top:6px;}
  .ukryte{display:none !important;}
  .srodek{text-align:center; padding:40px 20px; color:var(--szary);}
  h2{font-size:18px; margin:0 0 12px;}
  .sukces-ikona{font-size:52px; text-align:center; margin:6px 0 0;}
  .sukces-tekst{text-align:center; font-size:18px; font-weight:600; margin:6px 0 2px;}
  .overlay-zapis{position:fixed; inset:0; background:rgba(15,17,21,.55);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:14px; z-index:50;}
  .overlay-zapis .spinner{width:42px; height:42px; border:4px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:kreciSie .8s linear infinite;}
  .overlay-zapis .tekst{color:#fff; font-size:16px; font-weight:600;}
  @keyframes kreciSie{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <img src="./ikona-192.png" alt="Rinkon">
  <div class="naglowek-tekst">
    <h1>Ewidencja Floty Rinkon</h1>
    <div class="kto" id="naglowekKto"></div>
  </div>
  <button type="button" id="motywBtn" aria-label="Zmień motyw">🌙</button>
  <button type="button" id="paletaBtn" aria-label="Zmień paletę kolorów">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path class="ikona-paletki" d="M12 2C6.48 2 2 6.15 2 11.2c0 3.1 2.6 4.4 4.4 4.4h1.7c.7 0 1.3.6 1.3 1.3 0 .4-.2.8-.5 1.1-.6.5-.9 1.2-.9 1.9 0 1.2 1.1 2.1 2.5 2.1 5.5 0 9.5-4.4 9.5-9.9C20 6.36 16.6 2 12 2Z"/>
      <circle cx="7.5" cy="10.5" r="1.4" fill="#fff"/>
      <circle cx="11.5" cy="7" r="1.4" fill="#fff"/>
      <circle cx="16" cy="9" r="1.4" fill="#fff"/>
      <circle cx="16" cy="13.5" r="1.4" fill="#fff"/>
    </svg>
  </button>
</header>

<main>
  <div class="kolejka-info" id="kolejkaInfo"></div>

  <!-- Brak kodu (D69) — awaryjne wejście, gdy link nie zadziałał -->
  <div id="widokBrakKodu" class="karta ukryte">
    <div class="srodek">
      <p style="font-size:40px; margin:0;">🔑</p>
      <p><b>Otwórz aplikację ze swojego osobistego linku.</b></p>
      <p style="font-size:15px;" id="brakKoduPodpowiedz"></p>
      <div style="margin-top:16px; text-align:left;">
        <p style="font-size:14px; margin:0 0 6px;">Masz swój kod od Marka? Wpisz go tutaj:</p>
        <input type="text" id="poleKodRecznie" placeholder="np. TijvKwJhKA" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="blad-pola" id="bladKodRecznie"></div>
        <button type="button" class="przycisk" style="margin-top:8px;" id="kodRecznieZapisz">Zapisz i kontynuuj</button>
      </div>
    </div>
  </div>

  <!-- ===================== EKRAN: START (dashboard pojazdu) ===================== -->
  <section id="ekranStart">
    <div class="karta">
      <div class="powitanie">
        <div class="avatar-krag" id="avatar">?</div>
        <div>
          <div class="p1" id="powitanieImie">Ładowanie…</div>
          <div class="p2" id="powitanieData"></div>
        </div>
      </div>

      <!-- Dashboard wybranego pojazdu (D54) -->
      <div id="dashboardPojazdu" class="ukryte">
        <div class="jedn" id="kartaWybranego"></div>
        <div class="metryki">
          <div class="metryka">
            <div class="m-et">Stan licznika</div>
            <div class="m-w" id="mLicznik">—</div>
            <div class="m-sub" id="mLicznikData"></div>
          </div>
          <div class="metryka">
            <div class="m-et">Wpisy w tym miesiącu</div>
            <div class="m-w" id="mWpisy">—</div>
            <div class="m-sub" id="mOstatniaBudowa"></div>
          </div>
        </div>
        <div id="terminyBox"></div>
        <button class="przycisk" id="startNowyWpisBtn">＋ Nowy wpis</button>
        <button class="przycisk-drugi" id="zmienPojazdBtn">🔄 Zmień pojazd</button>

<script src="./config.js"></script>
<script>
/* =====================================================================
   EWIDENCJA FLOTY RINKON — logika PWA

   Zasady:
   - Kod dostępu z adresu (?kod=XXXX), zapamiętywany lokalnie (D7).
   - Wpis = dzień pracy. Dzień bez wpisu = postój i nie zostawia śladu
     w arkuszu, dokładnie jak na papierowym druczku (D102).
   - Brak zasięgu nie może zgubić wpisu: kolejka w localStorage (D50).
   - Kierowca poprawia i anuluje tylko własne wpisy (D53).
   ===================================================================== */

var STAN = {
  kod: null, imie: null, jednostki: [], budowy: [], kategorie: [],
  aktywna: null, wpisy: [], edytowanyId: null,
  // D98 — wartości domyślne; prawdziwe przychodzą ze `status`.
  limity: { litryOstrzezenie: 300, litryBlokada: 1000, przyrostKm: 1500, przyrostMth: 24 }
};
var KLUCZ_KOD = 'ewidencja_kod';
var KLUCZ_KOLEJKA = 'ewidencja_kolejka';
var KLUCZ_MOTYW = 'ewidencja_motyw';
var KLUCZ_PALETA = 'ewidencja_paleta';
var KLUCZ_POJAZD = 'ewidencja_pojazd';
var KLUCZ_CACHE = 'ewidencja_cache';

/* ---------- pomocnicze ---------- */
function el(id){ return document.getElementById(id); }
function bezpiecznyTekst(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pokazEkran(nazwa){
  ['ekranStart','ekranWpis','ekranSukces','ekranWpisy'].forEach(function(e){
    el(e).classList.add('ukryte');
  });
  el(nazwa).classList.remove('ukryte');
  el('navStart').classList.toggle('aktywna', nazwa === 'ekranStart');
  el('navNowy').classList.toggle('aktywna', nazwa === 'ekranWpis');
  el('navWpisy').classList.toggle('aktywna', nazwa === 'ekranWpisy');
  window.scrollTo(0, 0);
}
function komunikat(idEl, tekst, typ){
  var e = el(idEl);
  e.className = 'komunikat ' + (typ || 'ok');
  e.innerHTML = tekst;
}
function schowajKomunikat(idEl){ el(idEl).className = 'komunikat'; }

/* Overlay z własnym tekstem — wzorzec z aplikacji floty (pokazOverlay).
   Przykrywa ekran, więc przy okazji blokuje podwójne kliknięcia. */
function pokazOverlay(tekst){
  el('overlayTekst').textContent = tekst || 'Zapisywanie… proszę czekać';
  el('overlay').classList.remove('ukryte');
}
function schowajOverlay(){ el('overlay').classList.add('ukryte'); }
function bladPola(idBox, idBlad, tekst){
  el(idBox).classList.add('pole-blad');
  el(idBlad).textContent = tekst;
}
function wyczyscBledy(){
  ['poleDataBox','poleLicznikBox','poleBudowaBox'].forEach(function(i){ el(i).classList.remove('pole-blad'); });
  if (el('ostrzezeniePrzyrost')) el('ostrzezeniePrzyrost').textContent = '';
  schowajKomunikat('wpisKomunikat');
}
function dzisiajISO(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function inicjaly(imie){
  if (!imie) return '?';
  var c = String(imie).trim().split(/\s+/);
  return ((c[0]?c[0].charAt(0):'') + (c[1]?c[1].charAt(0):'')).toUpperCase() || '?';
}
/* D94: NAZWA `formatLicznik_()` znaczy w aplikacji floty COŚ PRZECIWNEGO — tam
   parsuje tekst na liczbę, tutaj formatuje liczbę na tekst. To pułapka przy
   przenoszeniu kodu między aplikacjami, więc tutejsza dostaje nazwę mówiącą
   wprost, co robi. */
function formatLicznik_(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* D95: pola liczbowe są typu `text`, nie `number` — i to jest świadome.
   `<input type="number">` z wartością „45,5" zwraca PUSTY STRING (sprawdzone),
   bo standard uznaje przecinek za nieprawidłowy. Kierowca wpisywał litry po
   polsku, widział „Zapisano" i tankowania nie było w arkuszu — cicha utrata
   danych, najgorszy możliwy błąd w dobrowolnej aplikacji.
   Ta funkcja przyjmuje przecinek i spacje, tak samo jak `formatLicznik_()` we flocie. */
function naLiczbe_(v){
  var s = String(v == null ? '' : v).trim().replace(/\s+/g, '').replace(',', '.');
  if (s === '') return null;
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}

/* Ikony PRZENIESIONE 1:1 z „Panel Floty.html" (funkcja rodzajIcon), na
   wyraźną prośbę Marka — to są kształty, które już zna z panelu kosztów
   i które mu odpowiadają (D57). Nie rysować tu własnych: jeśli ikona ma się
   zmienić, zmienia się ją najpierw w panelu, potem tutaj. */
var IKONY = {
  auto: '<path d="M5 13l1.5-4.5A2 2 0 018.4 7h7.2a2 2 0 011.9 1.5L19 13"/><path d="M4 13h16a1 1 0 011 1v3h-2"/><path d="M5 17H3v-3a1 1 0 011-1"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/><path d="M9.5 17h5"/>',
  bus: '<path d="M3 13l2-6h11l3 6"/><path d="M3 13h18v5h-2"/><path d="M7 18H5v-5"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M10 18h5"/>',
  koparka: '<path d="M3 18h10"/><circle cx="5" cy="18" r="1.6"/><circle cx="11" cy="18" r="1.6"/><path d="M4 15h8v-4H6l-2 4z"/><path d="M12 12l4-6 4 2-3 5"/><path d="M20 8l1 4-3 1"/>',
  hds: '<path d="M3 13l2-6h6l2 6"/><path d="M3 13h18v5h-2"/><path d="M7 18H5v-5"/><circle cx="8" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M13 7l6-3"/><path d="M19 4v5"/><path d="M19 9l-1.5 1.5"/>',
  przyczepa: '<rect x="2" y="8" width="15" height="7" rx="1"/><path d="M17 12h5"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="12" cy="17.5" r="1.8"/>',
  inne: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'
};
function ikonaTypu(typ, kolor){
  var t = String(typ||'').toLowerCase(), k = 'inne';
  if (t.indexOf('kopark') !== -1 || t.indexOf('ładowarka') !== -1) k = 'koparka';
  else if (t.indexOf('hds') !== -1 || t.indexOf('dźwig') !== -1) k = 'hds';
  else if (t.indexOf('przyczep') !== -1) k = 'przyczepa';
  else if (t.indexOf('dostaw') !== -1 || t.indexOf('bus') !== -1 || t.indexOf('ciężarow') !== -1) k = 'bus';
  else if (t.indexOf('osobow') !== -1) k = 'auto';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="' + (kolor||'currentColor') +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IKONY[k] + '</svg>';
}

/* ---------- motyw i paleta ---------- */
/* Pasek systemowy telefonu (theme-color). Reaguje TYLKO na paletę, nie na
   tryb jasny/ciemny — dokładnie jak w aplikacji floty (decyzja Marka
   20.07.2026, powtórzona 26.07.2026 dla ewidencji). System przyjmuje jeden
   pełny kolor, gradientu tam być nie może, więc bierzemy najciemniejszy
   odcień nagłówka danej palety. */
var KOLOR_PASKA = { grafit: '#27272a', burgund: '#4c0519' };
function wczytajMotyw(){
  var m = localStorage.getItem(KLUCZ_MOTYW) || 'jasny';
  document.documentElement.setAttribute('data-motyw', m);
  el('motywBtn').textContent = m === 'ciemny' ? '🌙' : '☀️';
  var p = localStorage.getItem(KLUCZ_PALETA) || KONFIG.PALETA_DOMYSLNA;
  document.documentElement.setAttribute('data-paleta', p);

  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', KOLOR_PASKA[p] || KOLOR_PASKA.grafit);
}
el('motywBtn').addEventListener('click', function(){
  var teraz = document.documentElement.getAttribute('data-motyw');
  localStorage.setItem(KLUCZ_MOTYW, teraz === 'ciemny' ? 'jasny' : 'ciemny');
  wczytajMotyw();
});
el('paletaBtn').addEventListener('click', function(){
  var teraz = document.documentElement.getAttribute('data-paleta');
  localStorage.setItem(KLUCZ_PALETA, teraz === 'burgund' ? 'grafit' : 'burgund');
  wczytajMotyw();
});

/* ---------- komunikacja z API ---------- */
function wolajAPI(akcja, dane){
  var payload = Object.assign({ akcja: akcja, token: KONFIG.TOKEN, kod: STAN.kod }, dane || {});
  return fetch(KONFIG.URL_API, { method: 'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); });
}

/* ---------- kolejka offline (D50, D65) ----------
   Model przeniesiony z aplikacji floty: każdy wpis w kolejce ma własny
   status i własny komunikat błędu, a odrzucony dostaje przyciski
   „Spróbuj ponownie" i „Usuń".

   Pierwsza wersja tylko liczyła oczekujące wpisy i przy nieudanej wysyłce
   po cichu przestawała próbować. Marek zgłosił: „dostałem info, że wpis ma
   się wysłać, ale się nie wysyła" — i nie było żadnego sposobu zobaczyć
   dlaczego ani ponowić. Wpis wisiał w telefonie bez śladu w arkuszu. */
function kolejka(){
  var k;
  try { k = JSON.parse(localStorage.getItem(KLUCZ_KOLEJKA) || '[]'); }
  catch(e){ return []; }
  if (!Array.isArray(k)) return [];
  // Migracja ze starego formatu (goły payload bez statusu).
  return k.map(function(w){
    if (w && w.dane) return w;
    return { tmp: Date.now() + Math.floor(Math.random()*1000), dane: w, status: 'oczekuje', blad: '' };
  });
}
function zapiszKolejke(k){ localStorage.setItem(KLUCZ_KOLEJKA, JSON.stringify(k)); }
function dodajDoKolejki(payload){
  var k = kolejka();
  k.push({ tmp: Date.now(), dane: payload, status: 'oczekuje', blad: '' });
  zapiszKolejke(k);
  odswiezKolejkeInfo();
}

function odswiezKolejkeInfo(){
  var k = kolejka(), e = el('kolejkaInfo');
  var oczekuje = k.filter(function(w){ return w.status === 'oczekuje'; }).length;
  var odrzucone = k.filter(function(w){ return w.status === 'odrzucony'; });
  if (!oczekuje && !odrzucone.length){ e.style.display = 'none'; e.innerHTML = ''; return; }
  e.style.display = 'block';

  var html = '';
  if (oczekuje) {
    html += '⏳ ' + oczekuje + (oczekuje === 1 ? ' wpis czeka' : ' wpisy czekają') +
      ' na wysłanie. Wyślą się same, gdy wróci zasięg.';
  }
  odrzucone.forEach(function(w){
    html += '<div class="odrzucony"><b>Wpis nie został przyjęty</b>' +
      (w.dane && w.dane.data ? ' (' + bezpiecznyTekst(w.dane.data) + ')' : '') + ': ' +
      bezpiecznyTekst(w.blad || 'nieznany błąd') +
      '<div class="p">' +
      '<button class="przycisk-maly" data-ponow="' + w.tmp + '">Spróbuj ponownie</button>' +
      '<button class="przycisk-czerwony" data-usun="' + w.tmp + '">Usuń</button>' +
      '</div></div>';
  });
  e.innerHTML = html;

  e.querySelectorAll('[data-ponow]').forEach(function(b){
    b.onclick = function(){ ponowZKolejki(Number(b.dataset.ponow)); };
  });
  e.querySelectorAll('[data-usun]').forEach(function(b){
    b.onclick = function(){ usunZKolejki(Number(b.dataset.usun)); };
  });
}

function ponowZKolejki(tmp){
  var k = kolejka();
  k.forEach(function(w){ if (w.tmp === tmp){ w.status = 'oczekuje'; w.blad = ''; } });
  zapiszKolejke(k);
  odswiezKolejkeInfo();
  wyslijKolejke();
}
function usunZKolejki(tmp){
  if (!confirm('Usunąć ten wpis z kolejki? Nie zapisze się w ewidencji.')) return;
  zapiszKolejke(kolejka().filter(function(w){ return w.tmp !== tmp; }));
  odswiezKolejkeInfo();
}

/* Flaga chroni przed dwoma równoległymi przebiegami (zdarzenie `online`
   w trakcie wysyłki uruchomionej przy starcie) — bez niej ten sam wpis
   mógłby polecieć dwa razy. */
var wysylanieTrwa = false;
// W-03 (01.08.2026): naprawa wyścigu — funkcja NIE trzyma już jednej
// „zamrożonej" kopii listy `k` przez cały czas wysyłki. Każdy zapis do
// localStorage najpierw odczytuje AKTUALNY stan i zmienia w nim tylko
// jeden konkretny wpis (po `tmp`) — inaczej wpis dodany w trakcie
// wysyłki trafiał do localStorage, ale kolejny zapis z tej funkcji
// nadpisywał całość starą kopią i nowy wpis znikał bez śladu.
function ustawStatusWKolejce_(tmp, zmiany){
  var aktualna = kolejka();
  var wpis = aktualna.filter(function(w){ return w.tmp === tmp; })[0];
  if (wpis) {
    for (var klucz in zmiany) wpis[klucz] = zmiany[klucz];
    zapiszKolejke(aktualna);
  }
  return aktualna;
}
function wyslijKolejke(){
  if (wysylanieTrwa) return Promise.resolve();
  var k = kolejka();
  if (!k.filter(function(w){ return w.status === 'oczekuje'; }).length) {
    odswiezKolejkeInfo();
    return Promise.resolve();
  }
  wysylanieTrwa = true;

  function nastepny(i){
    if (i >= k.length) {
      wysylanieTrwa = false;
      // Wysłane usuwamy; odrzucone ZOSTAJĄ, żeby kierowca je zobaczył.
      zapiszKolejke(kolejka().filter(function(w){ return w.status !== 'wyslany'; }));
      odswiezKolejkeInfo();
      return;
    }
    if (k[i].status !== 'oczekuje') return nastepny(i + 1);

    return wolajAPI('nowyWpis', k[i].dane).then(function(odp){
      if (odp && odp.ok) {
        ustawStatusWKolejce_(k[i].tmp, { status: 'wyslany' });
      } else if (odp && odp.blad === 'E013') {
        // W-01 (01.08.2026): było E018, teraz E013 jak we flocie.
        // WYJĄTEK: E013 znaczy „serwer zajęty, spróbuj za chwilę" — to jedyny
        // błąd z definicji przejściowy. Oznaczenie go jako odrzucony kazałoby
        // kierowcy klikać ręcznie coś, co samo by przeszło. Dotyczy dokładnie
        // sytuacji, dla której powstała blokada zapisu (D89): paczka zaległych
        // wpisów wysyłana jeden po drugim.
        ustawStatusWKolejce_(k[i].tmp, { status: 'oczekuje' });
        wysylanieTrwa = false;
        odswiezKolejkeInfo();
        return;
      } else {
        // Pozostałe odpowiedzi serwera są trwałe — ponawianie w pętli nic
        // nie zmieni. Pokazujemy powód i oddajemy decyzję człowiekowi.
        ustawStatusWKolejce_(k[i].tmp, {
          status: 'odrzucony',
          blad: (odp && odp.wiadomosc) ? odp.wiadomosc : 'Serwer nie odpowiedział poprawnie.'
        });
      }
      return nastepny(i + 1);
    }).catch(function(){
      // Brak sieci — przerywamy, wpis zostaje „oczekuje" i pójdzie później.
      wysylanieTrwa = false;
      odswiezKolejkeInfo();
    });
  }
  return Promise.resolve(nastepny(0));
}

window.addEventListener('online', function(){ wyslijKolejke(); });
/* Na telefonie zdarzenie `online` bywa niewiarygodne — system potrafi go nie
   wysłać, gdy aplikacja była w tle. Powrót do aplikacji to drugi, pewniejszy
   moment na próbę wysyłki. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && navigator.onLine) wyslijKolejke();
});

/* ---------- kod dostępu i przekaźnik iOS (D69) ----------

   Problem: na iPhonie zainstalowana ikonka i karta Safari to DWA OSOBNE
   konteksty z osobnym `localStorage`. Kierowca klika osobisty link w Safari
   (kod zapisuje się tam), instaluje ikonkę na ekranie głównym — i ikonka
   startuje z pustym magazynem, czyli „brak kodu". Bez obejścia część ludzi
   z iPhone'ami odbije się na pierwszym uruchomieniu, a aplikacja jest
   dobrowolna (D5a), więc drugi raz nie spróbują.

   Cache Storage, w odróżnieniu od localStorage, jest DZIELONE między tymi
   kontekstami — używamy go jako przechowalni. Rozwiązanie sprawdzone w becie
   aplikacji floty. */
var NAZWA_RELAY_KODU = 'ewidencja-kod-relay';

function zapiszKodDoRelay_(k){
  if (!('caches' in window) || !k) return;
  caches.open(NAZWA_RELAY_KODU).then(function(cache){
    cache.put('/__kod__', new Response(k));
  }).catch(function(){});
}
function odczytajKodZRelay_(){
  if (!('caches' in window)) return Promise.resolve(null);
  return caches.open(NAZWA_RELAY_KODU)
    .then(function(cache){ return cache.match('/__kod__'); })
    .then(function(resp){ return resp ? resp.text() : null; })
    .catch(function(){ return null; });
}

/* Dwie różne przyczyny „braku kodu" wymagają dwóch różnych rad, więc
   rozpoznajemy je po user agencie zamiast dawać jeden ogólny tekst. */
function ustawPodpowiedzBrakKodu_(){
  var ua = navigator.userAgent || '';
  var wbudowana = /FBAN|FBAV|Instagram|WhatsApp|Messenger/i.test(ua);
  el('brakKoduPodpowiedz').innerHTML = wbudowana
    ? 'Wygląda na to, że link otworzył się wewnątrz innej aplikacji (WhatsApp / ' +
      'Messenger / Instagram) — <b>skopiuj link i otwórz go w przeglądarce</b>, to ' +
      'zwykle pomaga. Jeśli nadal nie działa — zadzwoń do Marka.'
    : 'Aplikacja spróbowała sama znaleźć Twój kod i się nie udało. ' +
      '<b>Otwórz swój osobisty link raz w zwykłej przeglądarce</b> (nie z tej ikonki), ' +
      'poczekaj aż strona się wczyta, a potem otwórz ikonkę jeszcze raz. ' +
      'Jeśli nie masz linku — zadzwoń do Marka.';
}

function zapiszKodRecznie_(){
  var wpisany = el('poleKodRecznie').value.trim();
  var blad = el('bladKodRecznie');
  if (!wpisany) { blad.textContent = 'Wpisz swój kod.'; blad.style.display = 'block'; return; }
  blad.style.display = 'none';
  localStorage.setItem(KLUCZ_KOD, wpisany);
  zapiszKodDoRelay_(wpisany);
  STAN.kod = wpisany;
  el('widokBrakKodu').classList.add('ukryte');
  uruchomAplikacje_();
}
el('kodRecznieZapisz').onclick = zapiszKodRecznie_;
el('poleKodRecznie').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); zapiszKodRecznie_(); }
});

/* D97: zły kod dostępu przestaje być ślepym zaułkiem.
   Ręczne wpisanie kodu istnieje właśnie dla ludzi, którym link nie zadziałał —
   a jedna literówka zapisywała zły kod na stałe, bez żadnego sposobu
   wyczyszczenia go z poziomu aplikacji. Człowiek, który już raz miał problem,
   zostawał z nim na dobre. */
function odrzucKod_(wiadomosc){
  localStorage.removeItem(KLUCZ_KOD);
  localStorage.removeItem(KLUCZ_CACHE);
  localStorage.removeItem(KLUCZ_POJAZD);
  if ('caches' in window) caches.delete(NAZWA_RELAY_KODU).catch(function(){});
  STAN.kod = null;
  STAN.jednostki = [];
  STAN.aktywna = null;

  ustawPodpowiedzBrakKodu_();
  el('brakKoduPodpowiedz').innerHTML =
    '<b>' + bezpiecznyTekst(wiadomosc || 'Ten kod nie działa.') + '</b><br>' +
    'Sprawdź, czy przepisałeś go dokładnie, albo otwórz swój osobisty link ' +
    'jeszcze raz. Jeśli nadal nie działa — zadzwoń do Marka.';
  pokazBrakKodu_();
}

/* Ekran „brak kodu" — JEDNO miejsce, bo prowadzą tu dwie różne drogi:
   odrzucenie złego kodu (D97) i zwykły start bez zapisanego kodu. Wcześniej
   każda robiła to po swojemu i druga zapominała schować dolny pasek —
   człowiek bez działającego kodu widział „Dodaj wpis" i mógł w to kliknąć. */
function pokazBrakKodu_(){
  el('ekranStart').classList.add('ukryte');
  el('nawigacja').classList.add('ukryte');
  el('widokBrakKodu').classList.remove('ukryte');
}

/* ---------- start ---------- */
function start(){
  wczytajMotyw();
  odswiezKolejkeInfo();
  el('poleData').max = dzisiajISO();     // D52 — brak dat z przyszłości

  var zUrl = new URLSearchParams(location.search).get('kod');
  if (zUrl) {
    localStorage.setItem(KLUCZ_KOD, zUrl);
    history.replaceState(null, '', location.pathname);
  }
  STAN.kod = localStorage.getItem(KLUCZ_KOD);

  if (STAN.kod) {
    // Zasilamy przekaźnik przy KAŻDYM udanym starcie, nie tylko przy świeżym
    // `?kod=` w adresie — inaczej wejście w karcie przeglądarki, gdzie link
    // był już wcześniej otwarty (aplikacja sama czyści adres), nigdy by go
    // nie uzupełniło.
    zapiszKodDoRelay_(STAN.kod);
    uruchomAplikacje_();
    return;
  }

  odczytajKodZRelay_().then(function(zRelay){
    if (zRelay) {
      localStorage.setItem(KLUCZ_KOD, zRelay);
      STAN.kod = zRelay;
      uruchomAplikacje_();
    } else {
      ustawPodpowiedzBrakKodu_();
      pokazBrakKodu_();
    }
  });
}

function uruchomAplikacje_(){
  el('ekranStart').classList.remove('ukryte');
  el('nawigacja').classList.remove('ukryte');   // D97 — pokazujemy dopiero z kodem
  // D60: pokaż od razu to, co wiemy z ostatniego razu, i dopiero potem
  // odśwież z serwera. Bez tego przy każdym otwarciu było „Ładowanie…",
  // potem mignięcie listy wyboru, a dopiero na końcu właściwy pojazd —
  // przy słabym zasięgu na budowie trwało to kilka sekund.
  pokazZPamieci();
  wyslijKolejke().then(odswiezStart);
}

function pokazZPamieci(){
  var cache;
  try { cache = JSON.parse(localStorage.getItem(KLUCZ_CACHE) || 'null'); }
  catch(e){ return; }
  if (!cache || !cache.jednostki) return;

  STAN.imie = cache.imie;
  STAN.jednostki = cache.jednostki;
  STAN.budowy = cache.budowy || [];
  STAN.kategorie = cache.kategorie || [];
  STAN.limity = cache.limity || STAN.limity;
  el('naglowekKto').textContent = cache.imie || '';
  el('avatar').textContent = inicjaly(cache.imie);
  el('powitanieImie').textContent = cache.imie
    ? 'Cześć, ' + String(cache.imie).trim().split(/\s+/).pop() + '!' : '';
  rysujSlowniki();

  var zapamietany = localStorage.getItem(KLUCZ_POJAZD);
  var pasuje = STAN.jednostki.filter(function(j){ return j.idPojazdu === zapamietany; })[0];
  if (pasuje) wybierzPojazd(pasuje, true);
  else if (STAN.jednostki.length === 1) wybierzPojazd(STAN.jednostki[0], true);
}

function odswiezStart(){
  return wolajAPI('status', {}).then(function(odp){
    if (!odp.ok) {
      // D97 — kod nieznany albo konto wyłączone: wracamy na ekran wpisywania.
      // W-01 (01.08.2026): było E002/E004, teraz E011/E015 jak we flocie.
      if (odp.blad === 'E011' || odp.blad === 'E015') { odrzucKod_(odp.wiadomosc); return; }
      el('powitanieImie').textContent = 'Błąd';
      el('listaJednostek').innerHTML = '<div class="srodek">' +
        bezpiecznyTekst(odp.wiadomosc || 'Nie udało się wczytać danych.') + '</div>';
      return;
    }
    STAN.imie = odp.imie;
    STAN.jednostki = odp.jednostki || [];
    STAN.budowy = odp.budowy || [];
    STAN.kategorie = odp.kategorie || [];
    STAN.limity = odp.limity || STAN.limity;
    // Zapisujemy na następne otwarcie (D60) — patrz pokazZPamieci().
    try {
      localStorage.setItem(KLUCZ_CACHE, JSON.stringify({
        imie: odp.imie, jednostki: STAN.jednostki,
        budowy: STAN.budowy, kategorie: STAN.kategorie, limity: STAN.limity
      }));
    } catch(e){ /* pełny localStorage — trudno, cache jest opcjonalny */ }
    el('naglowekKto').textContent = odp.imie;
    el('avatar').textContent = inicjaly(odp.imie);
    // W zakładce Kierowcy imiona są zapisane jako „Nazwisko Imię", więc
    // imię to OSTATNI człon — tak samo jak w aplikacji floty.
    el('powitanieImie').textContent = 'Cześć, ' + String(odp.imie).trim().split(/\s+/).pop() + '!';

    // D54: pamiętamy ostatnio wybrany pojazd i od razu pokazujemy jego pulpit.
    var zapamietany = localStorage.getItem(KLUCZ_POJAZD);
    var pasuje = STAN.jednostki.filter(function(j){ return j.idPojazdu === zapamietany; })[0];
    if (pasuje) wybierzPojazd(pasuje);
    else if (STAN.jednostki.length === 1) wybierzPojazd(STAN.jednostki[0]);
    else pokazWyborPojazdu();

    rysujSlowniki();
  }).catch(function(){
    el('powitanieImie').textContent = 'Brak połączenia';
    el('listaJednostek').innerHTML = '<div class="srodek">Brak zasięgu. ' +
      'Możesz zapisać wpis — wyśle się, gdy sieć wróci.</div>';
  });
}

/* Budowa jako zwykła lista rozwijana — dokładnie jak w aplikacji floty
   (`<select id="f-budowa">`). Wcześniej było `input list=datalist`, które na
   telefonie zachowuje się nieprzewidywalnie: raz podpowiada, raz pozwala
   wpisać cokolwiek. Marek chce jednego, znanego zachowania w obu aplikacjach.

   `dodatkowa` pozwala dołożyć wartość spoza słownika — np. gdy ostatnia
   budowa pojazdu została w międzyczasie zdezaktywowana albo jest wpisem
   łączonym („Płock + Gostynin", D45). Bez tego select nie mógłby jej pokazać. */
function rysujSlowniki(dodatkowa){
  var wybrana = el('poleBudowa').value;
  var lista = STAN.budowy.slice();
  [dodatkowa, wybrana].forEach(function(v){
    if (v && lista.indexOf(v) === -1) lista.push(v);
  });
  el('poleBudowa').innerHTML = '<option value="">— wybierz —</option>' +
    lista.map(function(b){
      return '<option value="' + bezpiecznyTekst(b) + '">' + bezpiecznyTekst(b) + '</option>';
    }).join('');
  if (wybrana) el('poleBudowa').value = wybrana;

  el('poleSerwis').innerHTML = '<option value="">— brak —</option>' +
    STAN.kategorie.map(function(k){
      return '<option value="' + bezpiecznyTekst(k) + '">' + bezpiecznyTekst(k) + '</option>';
    }).join('');
}

/* ---------- wybór pojazdu i jego pulpit (D54) ---------- */
function pokazWyborPojazdu(){
  el('dashboardPojazdu').classList.add('ukryte');
  el('wyborPojazdu').classList.remove('ukryte');
  el('powitanieData').textContent = STAN.jednostki.length
    ? 'Wybierz pojazd' : 'Nie masz jeszcze przypisanego pojazdu';
  rysujJednostki();
}

function wybierzPojazd(j, zPamieci){
  STAN.aktywna = j;
  localStorage.setItem(KLUCZ_POJAZD, j.idPojazdu);
  el('wyborPojazdu').classList.add('ukryte');
  el('dashboardPojazdu').classList.remove('ukryte');
  // To jest pulpit JEDNEGO pojazdu, więc „Moje pojazdy" wprowadzało w błąd
  // (zgłoszenie Marka). Nazwa pojazdu jest na karcie poniżej, więc tutaj
  // mówimy tylko, na co się patrzy.
  el('powitanieData').textContent = STAN.jednostki.length > 1
    ? 'Pulpit pojazdu · masz ich ' + STAN.jednostki.length
    : 'Pulpit pojazdu';

  // D70 — odpiąć można tylko to, co kierowca sam sobie dodał.
  el('odepnijBtn').classList.toggle('ukryte', j.sposob !== 'dodane samodzielnie');

  el('kartaWybranego').style.borderLeftColor = j.kolor;
  el('kartaWybranego').innerHTML =
    '<div class="ikona-krag" style="border-color:' + j.kolor + '">' + ikonaTypu(j.typ, j.kolor) + '</div>' +
    '<div class="tresc"><div class="linia1">' + bezpiecznyTekst(j.tytul) + '</div>' +
    '<div class="linia2">' + bezpiecznyTekst(j.podtytul) + '</div></div>';

  el('mLicznik').textContent = j.ostatniStanLicznika
    ? formatLicznik_(j.ostatniStanLicznika) + ' ' + j.jednostkaLicznika : '—';
  el('mLicznikData').textContent = j.ostatniaData ? 'z ' + j.ostatniaData : 'brak wpisów';
  el('mOstatniaBudowa').textContent = j.ostatniaBudowa ? 'ostatnio: ' + j.ostatniaBudowa : '';
  rysujTerminy(j);

  // Przy rysowaniu z pamięci nie strzelamy do sieci — zrobi to zaraz
  // odswiezStart(), który i tak wywoła wybierzPojazd() drugi raz.
  if (zPamieci) { el('mWpisy').textContent = '…'; return; }
  el('mWpisy').textContent = '…';

  // Licznik wpisów w bieżącym miesiącu — dociągamy w tle, bo to detal.
  wolajAPI('historiaPojazdu', { idPojazdu: j.idPojazdu }).then(function(odp){
    if (!odp.ok) { el('mWpisy').textContent = '—'; return; }
    STAN.wpisy = odp.wpisy || [];
    var m = dzisiajISO().slice(0, 7);
    el('mWpisy').textContent = STAN.wpisy.filter(function(w){
      return !w.anulowany && w.data.slice(0, 7) === m;
    }).length;
  }).catch(function(){ el('mWpisy').textContent = '—'; });
}

/* D56: terminy i serwis. Aplikacja tylko POKAZUJE to, co już jest w arkuszu
   — nie przypomina, nie wysyła powiadomień, nie liczy nic ponad odejmowanie. */
function rysujTerminy(j){
  var box = el('terminyBox');
  var lista = j.terminy || [];
  if (!lista.length) { box.innerHTML = ''; return; }

  var jed = j.jednostkaLicznika;
  box.innerHTML = '<div class="terminy"><div class="t-naglowek">Terminy i serwis</div>' +
    lista.map(function(t){
      var wartosc, klasa = t.uwaga ? ' pilny' : '';
      if (t.nazwa === 'Serwis') {
        if (t.zostalo < 0) { wartosc = 'przekroczony o ' + formatLicznik_(Math.abs(t.zostalo)) + ' ' + jed; klasa = ' pominiety'; }
        else wartosc = 'za ' + formatLicznik_(t.zostalo) + ' ' + jed;
        wartosc += ' <span style="color:var(--szary); font-weight:400;">(' + formatLicznik_(t.wartosc) + ' ' + jed + ')</span>';
      } else {
        if (t.dni < 0) { wartosc = 'minął ' + t.data; klasa = ' pominiety'; }
        else if (t.dni === 0) { wartosc = 'dziś!'; }
        else wartosc = t.data + ' <span style="color:var(--szary); font-weight:400;">(za ' + t.dni + ' dni)</span>';
      }
      return '<div class="termin' + klasa + '"><span class="t-nazwa">' + bezpiecznyTekst(t.nazwa) +
        '</span><span class="t-wartosc">' + wartosc + '</span></div>';
    }).join('') + '</div>';
}

/* Opis pod nazwą pojazdu. Musi znieść dane niemożliwe: w arkuszu potrafi
   zostać wpis z datą z przyszłości (zrobiony, zanim doszła blokada D52,
   albo dopisany ręcznie w arkuszu). Wtedy `dniOdWpisu` jest UJEMNE i bez
   tego zabezpieczenia na ekranie widniało „brak wpisu od -2 dni". */
function opisOstatniegoWpisu(j){
  if (!j.ostatniaData) return 'brak wpisów';
  var d = j.dniOdWpisu;
  if (d < 0) return 'wpis z datą ' + j.ostatniaData + ' (przyszła data!)';
  if (d === 0) return 'ostatni wpis: dziś';
  if (d === 1) return 'ostatni wpis: wczoraj';
  return 'brak wpisu od ' + d + ' dni';
}

function rysujJednostki(){
  var box = el('listaJednostek');
  if (!STAN.jednostki.length) {
    box.innerHTML = '<div class="srodek">Dodaj auto lub koparkę, żeby zacząć wpisywać.</div>';
    return;
  }
  box.innerHTML = STAN.jednostki.map(function(j, i){
    var opis = opisOstatniegoWpisu(j);
    return '<div class="jedn' + (j.brakUwaga ? ' uwaga' : '') + '" style="border-left-color:' +
        j.kolor + '" data-wybierz="' + i + '">' +
      '<div class="ikona-krag" style="border-color:' + j.kolor + '">' + ikonaTypu(j.typ, j.kolor) + '</div>' +
      '<div class="tresc">' +
        '<div class="linia1">' + bezpiecznyTekst(j.tytul) + '</div>' +
        '<div class="linia2">' + bezpiecznyTekst(j.podtytul) + ' &middot; ' + opis + '</div>' +
      '</div>' +
      (j.sposob === 'dodane samodzielnie'
        ? '<button class="przycisk-czerwony" data-odepnij="' + i + '" title="Odepnij">📌</button>'
        : '') +
    '</div>';
  }).join('');
  box.querySelectorAll('[data-wybierz]').forEach(function(e){
    e.onclick = function(ev){
      if (ev.target.closest('[data-odepnij]')) return;   // klik w 📌 to nie wybór
      wybierzPojazd(STAN.jednostki[Number(e.dataset.wybierz)]);
    };
  });
  box.querySelectorAll('[data-odepnij]').forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      odepnijZListy_(STAN.jednostki[Number(b.dataset.odepnij)]);
    };
  });
}

/* ---------- tankowanie: powtarzalne pary litry + licznik (D51) ---------- */
function dodajWierszTankowania(litry, licznik){
  var jed = STAN.aktywna ? STAN.aktywna.jednostkaLicznika : 'km';
  var div = document.createElement('div');
  div.className = 'tank-item';
  div.innerHTML =
    '<input type="text" inputmode="decimal" class="t-litry" placeholder="litry" value="' +
      bezpiecznyTekst(litry || '') + '">' +
    '<input type="text" inputmode="numeric" class="t-licznik" placeholder="licznik (' + jed + ')" value="' +
      bezpiecznyTekst(licznik || '') + '">' +
    '<button type="button" class="tank-usun" aria-label="Usuń">&times;</button>';
  div.querySelector('.tank-usun').onclick = function(){ div.remove(); odswiezPodgladTankowania(); };
  div.querySelectorAll('input').forEach(function(i){ i.oninput = odswiezPodgladTankowania; });
  el('listaTankowan').appendChild(div);
  odswiezPodgladTankowania();
}
/* D95: zbiera tankowania, normalizując przecinek na kropkę.
   Przy `tylkoSprawdz = true` nie zwraca danych, tylko `true`, jeśli któreś
   pole zawiera coś, co nie jest liczbą — wtedy walidacja pokaże błąd zamiast
   po cichu pominąć wiersz. */
/* D99: dolna granica to ostatni znany stan licznika PRZED wybraną datą,
   górna to stan wpisany na koniec tego dnia. Liczymy z tej samej historii,
   z której bierze się podpowiedź licznika (D82) — bez dodatkowego żądania. */
function zakresLicznikaLokalnie_(){
  var min = null, max = null;
  var data = el('poleData').value;

  (STAN.wpisy || []).forEach(function(w){
    if (w.anulowany || w.licznik === '' || w.licznik == null) return;
    if (STAN.edytowanyId && w.idWpisu === STAN.edytowanyId) return;
    if (data && w.data >= data) return;
    var v = Number(w.licznik);
    if (!isNaN(v) && (min === null || v > min)) min = v;
  });
  if (min === null && STAN.aktywna && STAN.aktywna.ostatniStanLicznika) {
    var o = Number(STAN.aktywna.ostatniStanLicznika);
    if (!isNaN(o) && (!data || !STAN.aktywna.ostatniaData || STAN.aktywna.ostatniaData < data)) min = o;
  }

  var dnia = naLiczbe_(el('poleLicznik').value);
  if (dnia !== null && !isNaN(dnia) && dnia > 0) max = dnia;

  return { min: min, max: max };
}

function zbierzTankowania(tylkoSprawdz){
  var wynik = [], bledne = false;
  el('listaTankowan').querySelectorAll('.tank-item').forEach(function(d){
    var poleL = d.querySelector('.t-litry');
    var poleK = d.querySelector('.t-licznik');
    var litry = naLiczbe_(poleL.value);
    var lic = naLiczbe_(poleK.value);

    d.classList.remove('tank-blad');

    // Pusty wiersz jest w porządku — to po prostu nieużyta linijka.
    if (litry === null && lic === null) return;

    // D98 — absurdalne tankowanie łapiemy od razu, bez czekania na serwer.
    if (isNaN(litry) || litry === null || litry <= 0 || isNaN(lic) ||
        litry > (STAN.limity.litryBlokada || 1000)) {
      bledne = true;
      d.classList.add('tank-blad');
      return;
    }

    // D99 — licznik przy tankowaniu musi mieścić się w przedziale możliwym
    // dla tego dnia. Sprawdzamy lokalnie, żeby kierowca zobaczył to przy polu,
    // a nie dopiero po odesłaniu formularza.
    if (lic !== null) {
      var z = zakresLicznikaLokalnie_();
      if ((z.min !== null && lic < z.min) || (z.max !== null && lic > z.max)) {
        bledne = true;
        d.classList.add('tank-blad');
        return;
      }
    }
    wynik.push({ litry: litry, licznik: lic === null ? '' : lic });
  });
  return tylkoSprawdz ? bledne : wynik;
}
function odswiezPodgladTankowania(){
  var t = zbierzTankowania();
  var jed = STAN.aktywna ? STAN.aktywna.jednostkaLicznika : 'km';
  el('tankPodglad').textContent = t.length
    ? 'Zapisze się jako: ' + t.map(function(x){
        return x.licznik ? (x.litry + 'L / ' + x.licznik + jed) : (x.litry + 'L');
      }).join(' + ')
    : '';
}
el('dodajTankowanieBtn').onclick = function(){ dodajWierszTankowania(); };

/* ---------- ekran wpisu ---------- */
function otworzWpis(j, wpisDoEdycji){
  if (!j) { pokazEkran('ekranStart'); return; }
  STAN.aktywna = j;
  STAN.edytowanyId = wpisDoEdycji ? wpisDoEdycji.idWpisu : null;
  wyczyscBledy();

  el('wpisTytul').textContent = wpisDoEdycji ? 'Popraw wpis' : 'Nowy wpis';
  // Marek: tytuł ma zawierać też rejestrację — kierowca musi widzieć na
  // pierwszy rzut oka, do którego pojazdu wpisuje.
  el('wpisPodtytul').textContent = j.tytul + ' · ' + j.podtytul;
  el('jednLicznika').textContent = '(' + j.jednostkaLicznika + ')';
  el('zapiszBtn').textContent = wpisDoEdycji ? 'Zapisz poprawkę' : 'Zapisz wpis';
  // F-22 (wzorzec floty, 01.08.2026): odpowiedni przycisk „Anuluj" wg trybu.
  el('wpisWrocBtn').classList.toggle('ukryte', !!wpisDoEdycji);
  el('wpisAnulujEdycjeBtn').classList.toggle('ukryte', !wpisDoEdycji);
  // Daty przy edycji nie ruszamy — jeden dzień = jeden wiersz (D1).
  el('poleDataBox').style.display = wpisDoEdycji ? 'none' : '';
  el('listaTankowan').innerHTML = '';

  if (wpisDoEdycji) {
    el('poleData').value = wpisDoEdycji.data;
    el('poleLicznik').value = wpisDoEdycji.licznik || '';
    rysujSlowniki(wpisDoEdycji.budowa || '');
    el('poleBudowa').value = wpisDoEdycji.budowa || '';
    el('poleSerwis').value = wpisDoEdycji.serwisKategoria || '';
    el('poleUwagi').value = wpisDoEdycji.uwagi || '';
    rozbijTankowanie(wpisDoEdycji.tankowanie);
    el('ostatniLicznikInfo').textContent = '';
  } else {
    el('poleData').value = dzisiajISO();
    el('poleLicznik').value = '';
    rysujSlowniki(j.ostatniaBudowa || '');   // D12 — podpowiedź ostatniej budowy
    el('poleBudowa').value = j.ostatniaBudowa || '';
    el('poleSerwis').value = '';
    el('poleUwagi').value = '';
    odswiezPodpowiedzLicznika();
  }
  dodajWierszTankowania();
  el('poleLicznikBox').style.display = (j.maLicznik === 'NIE') ? 'none' : '';
  pokazEkran('ekranWpis');
}

/** Rozkłada tekst „55L / 55236km + 45L / 56236km" z powrotem na pola. */
function rozbijTankowanie(tekst){
  if (!tekst) return;
  String(tekst).split('+').forEach(function(cz){
    var m = cz.trim().match(/^([\d.,]+)\s*L\s*(?:\/\s*([\d.,]+))?/i);
    if (m) dodajWierszTankowania(m[1], m[2] || '');
  });
}

/* Podpowiedź „ostatnio X km" musi dotyczyć dnia POPRZEDZAJĄCEGO wybraną datę,
   nie po prostu najnowszego wpisu. Marek zgłosił, że przy wpisie wstecznym
   aplikacja pokazywała (i porównywała do) najświeższy licznik, przez co
   sygnalizowała błąd tam, gdzie wszystko było w porządku.

   Liczymy z lokalnie wczytanej historii — bez dodatkowego żądania. Gdy
   historii nie ma (np. zaraz po zapisie), pokazujemy stan ogólny z dopiskiem,
   żeby nie udawać precyzji, której nie mamy. */
function odswiezPodpowiedzLicznika(){
  var j = STAN.aktywna, e = el('ostatniLicznikInfo');
  if (!j) { e.textContent = ''; return; }
  var data = el('poleData').value;

  var wpisy = (STAN.wpisy || []).filter(function(w){
    return !w.anulowany && w.licznik !== '' && w.licznik != null &&
           (!STAN.edytowanyId || w.idWpisu !== STAN.edytowanyId);
  });

  if (data && wpisy.length) {
    var przed = null;
    wpisy.forEach(function(w){
      if (w.data >= data) return;
      if (!przed || w.data > przed.data) przed = w;
    });
    if (przed) {
      e.textContent = 'Poprzedni dzień z wpisem: ' + przed.data + ' — ' +
        formatLicznik_(przed.licznik) + ' ' + j.jednostkaLicznika;
      return;
    }
    e.textContent = 'Brak wcześniejszego wpisu przed ' + data + '.';
    return;
  }

  e.textContent = j.ostatniStanLicznika
    ? 'Ostatni znany stan: ' + formatLicznik_(j.ostatniStanLicznika) + ' ' + j.jednostkaLicznika +
      (j.ostatniaData ? ' (' + j.ostatniaData + ')' : '')
    : '';
}
el('poleData').addEventListener('change', odswiezPodpowiedzLicznika);

/* D98 — ostrzeżenie o podejrzanie dużym przyroście licznika, liczone NA
   MIEJSCU, zanim wpis pojedzie na serwer. Wcześniej ten próg istniał tylko
   po stronie serwera, więc kierowca dowiadywał się o literówce dopiero
   po zapisaniu — a to jest moment, w którym najtrudniej ją poprawić.
   To ostrzeżenie, nie blokada: duży przyrost bywa prawdziwy (długa trasa). */
function ostrzezOPrzyroscie(){
  var e = el('ostrzezeniePrzyrost');
  if (!e) return;
  e.textContent = '';
  var j = STAN.aktywna;
  if (!j || STAN.edytowanyId) return;

  var teraz = naLiczbe_(el('poleLicznik').value);
  var poprzedni = Number(j.ostatniStanLicznika);
  if (teraz === null || isNaN(teraz) || !j.ostatniStanLicznika || isNaN(poprzedni)) return;
  if (teraz <= poprzedni) return;   // cofnięcie ma własne ostrzeżenie serwera (W001)

  var jed = j.jednostkaLicznika || 'km';
  var prog = jed === 'mth'
    ? (STAN.limity.przyrostMth || 24)
    : (STAN.limity.przyrostKm || 1500);

  var dni = 1;
  if (j.ostatniaData && el('poleData').value) {
    var r = Math.round((new Date(el('poleData').value) - new Date(j.ostatniaData)) / 86400000);
    if (r > 0) dni = r;
  }

  var przyrost = teraz - poprzedni;
  if (przyrost > prog * dni) {
    e.textContent = 'Uwaga: to o ' + formatLicznik_(przyrost) + ' ' + jed +
      ' więcej niż ostatnio' + (dni > 1 ? ' (przez ' + dni + ' dni)' : '') +
      '. Sprawdź, czy nie ma literówki — zapisać i tak można.';
  }
}
el('poleLicznik').addEventListener('input', ostrzezOPrzyroscie);
el('poleData').addEventListener('change', ostrzezOPrzyroscie);

el('zapiszBtn').onclick = function(){
  var j = STAN.aktywna;
  if (!j) return;
  wyczyscBledy();

  var data = el('poleData').value;
  var licznik = el('poleLicznik').value;
  var zlePola = [];   // D96 — nazwy pól do wypisania w komunikacie

  if (!STAN.edytowanyId) {
    if (!data) { bladPola('poleDataBox','bladData','Podaj datę.'); zlePola.push('Data'); }
    else if (data > dzisiajISO()) {
      bladPola('poleDataBox','bladData','Nie można wpisać daty z przyszłości.'); zlePola.push('Data');
    }
  }

  // D95 — licznik jest polem tekstowym, więc trzeba go sprawdzić samodzielnie.
  var licznikLiczba = naLiczbe_(licznik);
  if (j.maLicznik === 'TAK' && licznikLiczba === null) {
    bladPola('poleLicznikBox','bladLicznik','Podaj stan licznika.'); zlePola.push('Stan licznika');
  } else if (licznikLiczba !== null && (isNaN(licznikLiczba) || licznikLiczba < 0)) {
    bladPola('poleLicznikBox','bladLicznik','Stan licznika musi być liczbą (bez minusów).');
    zlePola.push('Stan licznika');
  }

  // Budowa jest wymagana (D83) — na papierowym druczku zawsze była wypełniona
  // i jest kolumną wydruku miesięcznego.
  if (!el('poleBudowa').value.trim()) {
    bladPola('poleBudowaBox','bladBudowa','Wybierz budowę.'); zlePola.push('Budowa');
  }

  // D95 — litry z przecinkiem muszą przejść, ale śmieci już nie.
  var bledneTankowanie = zbierzTankowania(true);
  if (bledneTankowanie) {
    var z = zakresLicznikaLokalnie_();
    var podp = 'Sprawdź zaznaczone tankowanie: litry od 0 do ' +
      (STAN.limity.litryBlokada || 1000) + '.';
    if (z.min !== null || z.max !== null) {
      podp += ' Licznik przy tankowaniu musi być ' +
        (z.min !== null ? 'nie mniejszy niż ' + formatLicznik_(z.min) : '') +
        (z.min !== null && z.max !== null ? ' i ' : '') +
        (z.max !== null ? 'nie większy niż ' + formatLicznik_(z.max) : '') + '.';
    }
    el('tankPodglad').textContent = podp;
    el('tankPodglad').style.color = 'var(--blad)';
    zlePola.push('Tankowanie');
  } else {
    el('tankPodglad').style.color = '';
  }

  if (zlePola.length) {
    // D96: komunikat MUSI wymieniać pola i przewinąć do siebie. Wzorzec
    // z aplikacji floty, powstały w becie po zgłoszeniu „kierowca klikał
    // ZAPISZ w kółko" — formularz jest dłuższy niż ekran, więc czerwone pole
    // bywa poza kadrem i człowiek nie wie, dlaczego nic się nie dzieje.
    komunikat('wpisKomunikat',
      'Nie zapisano — sprawdź zaznaczone na czerwono pola: <b>' +
      zlePola.join(', ') + '</b>.', 'blad');
    el('wpisKomunikat').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  var payload = {
    idPojazdu: j.idPojazdu,
    data: data,
    licznik: licznikLiczba === null ? '' : licznikLiczba,
    budowa: el('poleBudowa').value,
    tankowania: zbierzTankowania(),
    serwisKategoria: el('poleSerwis').value,
    uwagi: el('poleUwagi').value
  };

  pokazOverlay(STAN.edytowanyId ? 'Zapisywanie poprawki…' : 'Zapisywanie… proszę czekać');

  if (STAN.edytowanyId) {
    // D66: poprawka wymaga sieci — nie da się jej zakolejkować, bo w tym
    // czasie ktoś inny mógłby zmienić ten sam wiersz i nie wiedzielibyśmy,
    // czyja wersja jest właściwa. Mówimy to wprost, zanim człowiek
    // wypełni formularz na darmo.
    if (!navigator.onLine) {
      schowajOverlay();
      komunikat('wpisKomunikat', 'Brak internetu. Poprawianie wpisu wymaga zasięgu — ' +
        'nowy wpis możesz zapisać offline, ale poprawkę trzeba zrobić online.', 'blad');
      return;
    }
    payload.idWpisu = STAN.edytowanyId;
    wolajAPI('edytujWpis', payload).then(function(odp){
      schowajOverlay();
      if (!odp.ok) { komunikat('wpisKomunikat', bezpiecznyTekst(odp.wiadomosc || 'Nie udało się zapisać.'), 'blad'); return; }
      el('sukcesTekst').textContent = 'Poprawiono';
      pokazSukces(odp);
      odswiezStart();   // przy poprawce stan jednostki może się zmienić dowolnie
    }).catch(function(){
      schowajOverlay();
      komunikat('wpisKomunikat', 'Brak połączenia — poprawki nie da się zapisać offline. Spróbuj później.', 'blad');
    });
    return;
  }

  // W-03 (01.08.2026, przeniesione z floty): gdy telefon JUŻ wie, że nie ma
  // sieci, nie ma sensu czekać, aż `fetch` sam się nie powiedzie — na słabym
  // zasięgu to potrafi trwać długo, zanim przeglądarka odda błąd. Prosto do
  // kolejki, bez próby.
  if (!navigator.onLine) {
    schowajOverlay();
    dodajDoKolejki(payload);
    el('sukcesTekst').textContent = 'Zapisano w telefonie';
    pokazSukces({ offline: true });
    return;
  }

  wolajAPI('nowyWpis', payload).then(function(odp){
    schowajOverlay();
    if (!odp.ok) { komunikat('wpisKomunikat', bezpiecznyTekst(odp.wiadomosc || 'Nie udało się zapisać.'), 'blad'); return; }
    el('sukcesTekst').textContent = 'Zapisano';
    // D81: nie wołamy `status` po zapisie — serwer oddał już nowy stan
    // jednostki. Trzy żądania jedno po drugim to było kilka sekund czekania.
    zastosujStanPo_(odp.stanPo);
    pokazSukces(odp);
  }).catch(function(){
    schowajOverlay();
    dodajDoKolejki(payload);
    el('sukcesTekst').textContent = 'Zapisano w telefonie';
    pokazSukces({ offline: true });
  });
};

/* D81: lokalna aktualizacja po zapisie — bez dodatkowego żądania.
   Odświeżenie z serwera i tak nastąpi, gdy kierowca wróci na Start. */
function zastosujStanPo_(stanPo){
  if (!stanPo) return;
  STAN.jednostki.forEach(function(j){
    if (j.idPojazdu !== stanPo.idPojazdu) return;
    if (stanPo.ostatniStanLicznika !== null) j.ostatniStanLicznika = stanPo.ostatniStanLicznika;
    j.ostatniaData = stanPo.ostatniaData;
    j.ostatniaBudowa = stanPo.ostatniaBudowa;
    j.dniOdWpisu = stanPo.dniOdWpisu;
    j.brakUwaga = false;
  });
  try {
    var c = JSON.parse(localStorage.getItem(KLUCZ_CACHE) || 'null');
    if (c) { c.jednostki = STAN.jednostki; localStorage.setItem(KLUCZ_CACHE, JSON.stringify(c)); }
  } catch(e){}
  STAN.wpisy = [];   // historia wymaga przeładowania
}

function pokazSukces(odp){
  schowajKomunikat('sukcesKomunikat');

  if (odp.offline) {
    komunikat('sukcesKomunikat', 'Brak zasięgu — wpis zapisany w telefonie i wyśle się sam, gdy sieć wróci.', 'uwaga');
  } else {
    if (odp.ostrzezenia && odp.ostrzezenia.length) {
      komunikat('sukcesKomunikat', '<ul><li>' +
        odp.ostrzezenia.map(bezpiecznyTekst).join('</li><li>') + '</li></ul>', 'uwaga');
    }
  }
  pokazEkran('ekranSukces');
}

/* D47: pytanie o lukę pojawia się DOPIERO po zapisie i jest opcjonalne. */

/* ---------- moje wpisy (D34: cała jednostka, nie tylko własne) ---------- */
function otworzWpisy(j){

  STAN.aktywna = j;
  el('wpisyTytul').textContent = 'Moje wpisy';

el('pokazAnulowane').onchange = rysujWpisy;

var MIESIACE = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec',
  'sierpień','wrzesień','październik','listopad','grudzień'];

function rysujWpisy(){
  var j = STAN.aktywna;
  var pokazAnul = el('pokazAnulowane').checked;
  var lista = STAN.wpisy.filter(function(w){ return pokazAnul || !w.anulowany; });

  if (!lista.length) {
    el('listaWpisow').innerHTML = '<div class="srodek">Brak wpisów.</div>';
    return;
  }

  var html = '', ostatniMiesiac = '', grupaOtwarta = false;
  lista.forEach(function(w, i){
    var m = w.data.slice(0, 7);
    if (m !== ostatniMiesiac) {
      if (grupaOtwarta) html += '</div>';
      ostatniMiesiac = m;
      // E-12 (01.08.2026): miesiąc zamknięty przez Marka — nagłówek klikalny,
      // grupa domyślnie zwinięta (tylko podgląd, bez rozwiniętych szczegółów).
      // Zwijanie "bo kierowca zadeklarował" czeka na E-08 (ewidencja nie ma
      // dziś takiej deklaracji).
      var zwiniety = !!w.zwiniety;
      html += '<div class="wpisy-naglowek-miesiac' + (zwiniety ? ' zwijalny' : '') +
          '" data-toggle-miesiac="' + m + '">' +
        MIESIACE[Number(m.slice(5,7)) - 1] + ' ' + m.slice(0,4) +
        (zwiniety ? ' <span class="plakietka">zamknięty — podgląd</span> <span class="naglowek-strzalka">▸</span>' : '') +
        '</div>';
      html += '<div class="wpisy-grupa-miesiaca' + (zwiniety ? ' ukryte' : '') +
        '" data-grupa-miesiaca="' + m + '">';
      grupaOtwarta = true;
    }
    var klasy = 'wpis' + (w.anulowany ? ' anulowany' : '');
    var jed = w.jednostkaLicznika || j.jednostkaLicznika;
    var plakietki = '';
    if (w.anulowany) plakietki += '<span class="plakietka plakietka-blad">Anulowany</span>';

    // Kolejność wg Marka (26.07.2026): data → stan licznika → kierowca i budowa.
    // Najważniejsza jest liczba, po którą kierowca tu wchodzi; kto i gdzie
    // to kontekst, więc schodzi niżej.
    html += '<div class="' + klasy + '" style="border-left-color:' +
        (w.anulowany ? '' : j.kolor) + '" data-i="' + i + '">' +
      '<div class="ikona-krag" style="border-color:' + j.kolor + '">' + ikonaTypu(j.typ, j.kolor) + '</div>' +
      '<div style="flex:1; min-width:0;">' +
        '<div class="wpis-tresc">' +
          // Data z lewej, licznik z PRAWEJ strony tej samej linii (uwaga Marka
          // 27.07.2026) — bez osobnego wiersza i bez ikony, sam podpis „Licznik:".
          '<div class="linia1"><span>' + w.data.slice(8) + '.' + w.data.slice(5,7) + '.' + w.data.slice(0,4) + '</span>' +
            (w.licznik !== '' && w.licznik != null
              ? '<span class="licznik-rog">Licznik: <b>' + formatLicznik_(w.licznik) + ' ' + jed + '</b>' +
                '</span>'
              : '') +
          '</div>' +
          (plakietki ? '<div>' + plakietki + '</div>' : '') +
          '<div class="linia2">' + bezpiecznyTekst(w.kierowca || '') +
            (w.budowa ? ' &middot; ' + bezpiecznyTekst(w.budowa) : '') + '</div>' +
          '<div class="linia-data"><span class="plakietka-id">' + bezpiecznyTekst(w.idWpisu) + '</span>' +
            '<span class="wpis-strzalka">&#9662;</span></div>' +
          '<div class="wpis-szczegoly"><div class="wsz-zawartosc">' +
            (w.tankowanie ? '<div class="wsz-wiersz dwie"><span>⛽ Tankowanie</span><b>' + bezpiecznyTekst(w.tankowanie) + '</b></div>' : '') +
            (w.serwisKategoria ? '<div class="wsz-wiersz dwie"><span>🔧 Serwis</span><b>' + bezpiecznyTekst(w.serwisKategoria) + '</b></div>' : '') +
            (w.uwagi ? '<div class="wsz-wiersz dwie"><span>📝 Uwagi</span><b>' + bezpiecznyTekst(w.uwagi) + '</b></div>' : '') +
            (!w.tankowanie && !w.serwisKategoria && !w.uwagi
              ? '<div class="wsz-wiersz"><span>Brak dodatkowych informacji</span><b></b></div>' : '') +
          '</div></div>' +
        '</div>' +
        (w.edytowalny
          ? '<div class="akcja"><button class="przycisk-maly" data-edytuj="' + i + '">✏️ Popraw</button>' +
            '<button class="przycisk-czerwony" data-anuluj="' + i + '">🗑 Anuluj wpis</button></div>'
          : '') +
      '</div>' +
    '</div>';
  });
  if (grupaOtwarta) html += '</div>';
  el('listaWpisow').innerHTML = html;

  el('listaWpisow').querySelectorAll('[data-toggle-miesiac].zwijalny').forEach(function(h){
    h.addEventListener('click', function(){
      var grupa = el('listaWpisow').querySelector('[data-grupa-miesiaca="' + h.dataset.toggleMiesiac + '"]');
      if (grupa) grupa.classList.toggle('ukryte');
      h.classList.toggle('rozwiniety');
    });
  });
  el('listaWpisow').querySelectorAll('.wpis').forEach(function(e){
    e.querySelector('.wpis-tresc').onclick = function(){ e.classList.toggle('rozwiniety'); };
  });
  el('listaWpisow').querySelectorAll('[data-edytuj]').forEach(function(b){
    b.onclick = function(){ otworzWpis(STAN.aktywna, lista[Number(b.dataset.edytuj)]); };
  });
  el('listaWpisow').querySelectorAll('[data-anuluj]').forEach(function(b){
    b.onclick = function(){
      var w = lista[Number(b.dataset.anuluj)];
      // D66 — jak przy poprawianiu: anulowanie wymaga sieci.
      if (!navigator.onLine) {
        alert('Brak internetu.\n\nAnulowanie wpisu wymaga zasięgu. Spróbuj, gdy wróci sieć.');
        return;
      }
      if (!confirm('Anulować wpis z ' + w.data + '?\n\nWpis zostanie przekreślony, ale zostanie w ewidencji.')) return;
      pokazOverlay('Anuluję wpis…');
      wolajAPI('anulujWpis', { idWpisu: w.idWpisu }).then(function(o){
        schowajOverlay();
        if (!o.ok) { alert(o.wiadomosc || 'Nie udało się anulować.'); return; }
        otworzWpisy(STAN.aktywna);
        odswiezStart();
      }).catch(function(){
        schowajOverlay();
        alert('Brak połączenia.');
      });
    };
  });
}

/* Po odpięciu kierowca MUSI wylądować na liście pojazdów. Zostawienie go na
   pulpicie właśnie odpiętej jednostki wyglądało, jakby nic się nie stało
   (zgłoszenie Marka 27.07.2026). Usuwamy ją też z lokalnego stanu, żeby nie
   mignęła ponownie, zanim serwer odpowie. */
function poOdpieciu_(idPojazdu){
  localStorage.removeItem(KLUCZ_POJAZD);
  STAN.jednostki = STAN.jednostki.filter(function(x){ return x.idPojazdu !== idPojazdu; });
  STAN.aktywna = null;
  STAN.wpisy = [];
  try {
    var c = JSON.parse(localStorage.getItem(KLUCZ_CACHE) || 'null');
    if (c) { c.jednostki = STAN.jednostki; localStorage.setItem(KLUCZ_CACHE, JSON.stringify(c)); }
  } catch(e){}
  pokazEkran('ekranStart');
  pokazWyborPojazdu();
  odswiezStart();
}

/* Odpięcie prosto z listy pojazdów — nie trzeba najpierw wchodzić na pulpit. */
function odepnijZListy_(j){
  if (!navigator.onLine) { alert('Brak internetu.\n\nOdpięcie pojazdu wymaga zasięgu.'); return; }
  if (!confirm('Odpiąć „' + j.tytul + '" od Twojej listy?\n\n' +
      'Twoje dotychczasowe wpisy zostaną w ewidencji — znika tylko z Twojego widoku.')) return;
  pokazOverlay('Odpinam…');
  wolajAPI('odepnijJednostke', { idPojazdu: j.idPojazdu }).then(function(o){
    schowajOverlay();
    if (!o.ok) { alert(o.wiadomosc || 'Nie udało się odpiąć.'); return; }
    poOdpieciu_(j.idPojazdu);
  }).catch(function(){ schowajOverlay(); alert('Brak połączenia.'); });
}

/* ---------- dodawanie pojazdu z listy (D59) ----------
   Wpisywanie z ręki („WP 2542J") było podatne na literówki, a operator
   koparki nie zna numeru rejestracyjnego swojej maszyny. Lista rozwijana
   zdejmuje z człowieka konieczność cokolwiek pamiętać. */
el('dodajJednostkeBtn').onclick = function(){
  el('dodajBox').classList.remove('ukryte');
  el('dodajJednostkeBtn').classList.add('ukryte');
  var sel = el('wyborNowej');
  sel.innerHTML = '<option value="">— ładowanie… —</option>';
  pokazOverlay('Wczytuję listę pojazdów…');

  wolajAPI('dostepneJednostki', {}).then(function(o){
    schowajOverlay();
    if (!o.ok || !o.jednostki || !o.jednostki.length) {
      sel.innerHTML = '<option value="">— brak pojazdów do dodania —</option>';
      return;
    }
    // Grupujemy po typie — 46 pozycji jednym ciągiem byłoby nie do przejścia.
    var grupy = {}, kolejnosc = [];
    o.jednostki.forEach(function(p){
      if (!grupy[p.typ]) { grupy[p.typ] = []; kolejnosc.push(p.typ); }
      grupy[p.typ].push(p);
    });
    sel.innerHTML = '<option value="">— wybierz —</option>' +
      kolejnosc.map(function(typ){
        return '<optgroup label="' + bezpiecznyTekst(typ) + '">' +
          grupy[typ].map(function(p){
            // E-19 (01.08.2026): separator „—" jak we flocie (Marek zgłosił,
            // że ewidencja miała „·" — niespójny styl). Maszyny (koparki)
            // dostają pusty podtytul z etykietaDropdownu_ — bez warunku
            // wychodziło „Hidromek (1) — " z samotną kreską na końcu.
            return '<option value="' + bezpiecznyTekst(p.idPojazdu) + '">' +
              bezpiecznyTekst(p.tytul) + (p.podtytul ? ' — ' + bezpiecznyTekst(p.podtytul) : '') + '</option>';
          }).join('') + '</optgroup>';
      }).join('');
  }).catch(function(){
    schowajOverlay();
    sel.innerHTML = '<option value="">— brak połączenia —</option>';
  });
};
el('anulujDodanieBtn').onclick = function(){
  el('dodajBox').classList.add('ukryte');
  el('dodajJednostkeBtn').classList.remove('ukryte');
};
el('potwierdzDodanieBtn').onclick = function(){
  var id = el('wyborNowej').value;
  if (!id) { alert('Wybierz pojazd z listy.'); return; }
  pokazOverlay('Dodaję pojazd…');
  wolajAPI('dodajJednostke', { idPojazdu: id }).then(function(o){
    schowajOverlay();
    if (!o.ok) { alert(o.wiadomosc || 'Nie udało się dodać.'); return; }
    el('dodajBox').classList.add('ukryte');
    el('dodajJednostkeBtn').classList.remove('ukryte');
    odswiezStart();
  }).catch(function(){
    schowajOverlay();
    alert('Brak połączenia.');
  });
};

/* ---------- nawigacja ---------- */
el('startNowyWpisBtn').onclick = function(){
  // Historia zasila podpowiedź licznika dla wybranej daty — jeśli jej nie ma,
  // dociągamy w tle i odświeżamy podpowiedź, gdy dojdzie.
  if (STAN.aktywna && !(STAN.wpisy || []).length) dociagnijHistorie_(STAN.aktywna);
  otworzWpis(STAN.aktywna);
};

function dociagnijHistorie_(j){
  wolajAPI('historiaPojazdu', { idPojazdu: j.idPojazdu }).then(function(odp){
    if (odp && odp.ok) { STAN.wpisy = odp.wpisy || []; odswiezPodpowiedzLicznika(); }
  }).catch(function(){});
}
el('zmienPojazdBtn').onclick = function(){ localStorage.removeItem(KLUCZ_POJAZD); pokazWyborPojazdu(); };

/* D70: odpiąć można tylko pojazd dodany samodzielnie — przypisania z
   arkusza zostają. Przycisk chowa się przy pojazdach przypisanych na stałe,
   żeby nikt nie klikał w ślepy zaułek. */
el('odepnijBtn').onclick = function(){
  var j = STAN.aktywna;
  if (!j) return;
  if (!navigator.onLine) { alert('Brak internetu.\n\nOdpięcie pojazdu wymaga zasięgu.'); return; }
  if (!confirm('Odpiąć „' + j.tytul + '" od Twojej listy?\n\n' +
      'Twoje dotychczasowe wpisy zostaną w ewidencji — znika tylko z Twojego widoku. ' +
      'Możesz go później dodać z powrotem.')) return;

  pokazOverlay('Odpinam…');
  wolajAPI('odepnijJednostke', { idPojazdu: j.idPojazdu }).then(function(o){
    schowajOverlay();
    if (!o.ok) { alert(o.wiadomosc || 'Nie udało się odpiąć.'); return; }
    poOdpieciu_(j.idPojazdu);
  }).catch(function(){
    schowajOverlay();
    alert('Brak połączenia.');
  });
};
// F-22 (wzorzec floty, 01.08.2026): „Anuluj" przy nowym wpisie — bez pytania
// wraca na dashboard (pola i tak dostają domyślne wartości przy kolejnym
// otworzWpis()). „Anuluj poprawianie" w edycji — wraca do „Moje wpisy",
// skąd wszedł użytkownik, i czyści tryb edycji.
el('wpisWrocBtn').onclick = function(){
  STAN.edytowanyId = null;
  pokazEkran('ekranStart');
};
el('wpisAnulujEdycjeBtn').onclick = function(){
  STAN.edytowanyId = null;
  otworzWpisy(STAN.aktywna);
};
el('sukcesWrocBtn').onclick = function(){ pokazEkran('ekranStart'); };
el('navStart').onclick = function(){ pokazEkran('ekranStart'); };
el('navNowy').onclick = function(){
  if (STAN.aktywna) otworzWpis(STAN.aktywna);
  else { pokazEkran('ekranStart'); pokazWyborPojazdu(); }
};
el('navWpisy').onclick = function(){
  if (STAN.aktywna) otworzWpisy(STAN.aktywna);
  else { pokazEkran('ekranStart'); pokazWyborPojazdu(); }
};

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(function(){});
}

start();
</script>
